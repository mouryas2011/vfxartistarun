name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint + Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3
      - name: Lint (shellcheck + config validation + no-secrets)
        run: ./scripts/lint.sh
      - name: Unit tests
        run: make unit
        shell: bash

  build:
    name: Build ISO + integration tests
    runs-on: ubuntu-24.04
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bash python3 \
            debootstrap xorriso \
            squashfs-tools dosfstools mtools
      - name: Build NEXORA development ISO
        run: make build
        shell: bash
      - name: Integration tests against ISO
        run: make integration
        shell: bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-dev-image
          path: |
            build/*.iso
            build/*.iso.sha256
            build/build-metadata.json
          if-no-files-found: error

  qemu-boot:
    name: QEMU UEFI boot gate
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Build ISO (shared with build job for isolation)
        run: |
          sudo apt-get install -y debootstrap xorriso \
            squashfs-tools dosfstools mtools
          make build
        shell: bash
      - name: QEMU UEFI boot test (headless, serial log, gate)
        run: |
          make qemu-serial
        shell: bash
      - name: Upload serial boot log
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: build/qemu-serial.log
        if: always()

  install-gate:
    name: Installer gate (install + reboot into installed system)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install build + QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bash python3 \
            debootstrap xorriso \
            squashfs-tools dosfstools mtools \
            qemu-system-x86 ovmf qemu-utils
      - name: Build ISO
        run: make build
        shell: bash
      - name: Install to scratch disk and boot installed system (UEFI)
        run: make qemu-install
        shell: bash
      - name: Upload install logs
        uses: actions/upload-artifact@v4
        with:
          name: install-gate-logs
          path: |
            build/qemu-install.log
            build/qemu-installed-boot.log
          if-no-files-found: warn
        if: always()

  graphical-gate:
    name: Graphical gate (Wayland compositor renders pixels)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install build + QEMU + GL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bash python3 \
            debootstrap xorriso \
            squashfs-tools dosfstools mtools \
            qemu-system-x86 ovmf qemu-utils \
            libegl1 libegl1-mesa libgl1 libgl1-mesa-dri libgbm1
      - name: Build ISO
        run: make build
        shell: bash
      - name: Graphical gate (boot with virtio-gpu, verify rendered pixels)
        run: make qemu-graphical
        shell: bash
      - name: Upload graphical gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: graphical-gate-artifacts
          path: |
            build/qemu-graphical.log
            build/nexora-graphical-screen.ppm
          if-no-files-found: warn
        if: always()